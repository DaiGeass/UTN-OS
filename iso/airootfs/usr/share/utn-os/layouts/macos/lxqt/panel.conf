[General]
config_version=1
panels=panel0, panel1

[panel0]
name=menubar
position=Top
panelSize=24
iconSize=16
alignment=0
plugins=startmenu, statusnotifier, volume, networkmonitor, worldclock
width=100
width-percent=true
background-color=#ececec

[panel1]
name=dock
position=Bottom
panelSize=64
iconSize=40
alignment=0
plugins=quicklaunch_panel1, taskbar_panel1, showdesktop_panel1
width=64
width-percent=true
background-color=#e8e8e8

[startmenu]
type=customcommand
alignment=Left
command=true
runWithBash=false
repeat=false
icon=/usr/share/utn-os/icons/utn-logo.png
text=Finder
tooltip=Menú de aplicaciones de macos
click=/usr/local/bin/utn-startmenu macos
minWidth=28
maxWidth=80
autoRotate=false
[statusnotifier]
type=statusnotifier
alignment=Right

[volume]
type=volume
alignment=Right
device=0

[networkmonitor]
type=networkmonitor
alignment=Right

[worldclock]
type=worldclock
alignment=Right
formatType=short
showDate=true
useAdvancedManualFormat=false

[quicklaunch_panel1]
type=quicklaunch
alignment=Left

apps\size=5
apps\1\desktop=/usr/share/utn-os/applications/utn-macos-files.desktop
apps\2\desktop=/usr/share/utn-os/applications/utn-macos-browser.desktop
apps\3\desktop=/usr/share/utn-os/applications/utn-macos-terminal.desktop
apps\4\desktop=/usr/share/utn-os/applications/utn-macos-office.desktop
apps\5\desktop=/usr/share/utn-os/applications/utn-macos-settings.desktop

[taskbar_panel1]
type=taskbar
groupingEnabled=true
closeOnMiddleClick=true

[showdesktop_panel1]
type=showdesktop
alignment=Right
