backend = "glx";
vsync = true;

shadow = true;
shadow-radius = 18;
shadow-opacity = 0.4;
shadow-offset-x = -12;
shadow-offset-y = -12;

fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 8;

corner-radius = 14;
round-borders-on-cli = true;

inactive-dim = 0.05;
inactive-opacity = 0.97;
active-opacity = 1.0;

blur-background = true;
blur-background-frame = true;
blur-method = "dual_kawase";
blur-strength = 7;

animations = ({
    triggers = [ "open" ];
    preset = "appear";
    scale = 0.92;
    duration = 0.18;
}, {
    triggers = [ "close" ];
    preset = "disappear";
    scale = 0.95;
    duration = 0.16;
}, {
    triggers = [ "hide" ];
    preset = "slide-out";
    direction = "down";
    duration = 0.22;
}, {
    triggers = [ "show" ];
    preset = "slide-in";
    direction = "up";
    duration = 0.22;
})

wintypes = {
    tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; blur-background = true; };
    popup_menu = { opacity = 0.96; blur-background = true; };
    dropdown_menu = { opacity = 0.96; blur-background = true; };
    dock = { shadow = false; };
}