[General]
config_version=1
panels=panel0

[panel0]
name=taskbar
position=Bottom
panelSize=30
iconSize=16
alignment=-1
plugins=startmenu, quicklaunch, taskbar, statusnotifier, volume, networkmonitor, worldclock, showdesktop
width=100
width-percent=true
background-color=#245edb

[startmenu]
type=customcommand
alignment=Left
command=true
runWithBash=false
repeat=false
icon=/usr/share/utn-os/icons/utn-logo.png
text=
tooltip=Menú de aplicaciones de windowsxp
click=/usr/local/bin/utn-startmenu windowsxp
minWidth=28
maxWidth=80
autoRotate=false
[quicklaunch]
type=quicklaunch
alignment=Left

apps\size=3
apps\1\desktop=/usr/share/utn-os/applications/utn-windowsxp-files.desktop
apps\2\desktop=/usr/share/utn-os/applications/utn-windowsxp-browser.desktop
apps\3\desktop=/usr/share/utn-os/applications/utn-windowsxp-terminal.desktop

[taskbar]
type=taskbar
groupingEnabled=false
showOnlyCurrentScreenTasks=false
closeOnMiddleClick=true

[statusnotifier]
type=statusnotifier
alignment=Right

[volume]
type=volume
alignment=Right
device=0

[networkmonitor]
type=networkmonitor
alignment=Right

[worldclock]
type=worldclock
alignment=Right
formatType=short
showDate=false
useAdvancedManualFormat=false

[showdesktop]
type=showdesktop
alignment=Right
