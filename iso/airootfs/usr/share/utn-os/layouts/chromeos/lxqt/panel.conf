[General]
config_version=1
panels=panel0

[panel0]
name=shelf
position=Bottom
panelSize=48
iconSize=24
alignment=0
plugins=startmenu, quicklaunch, taskbar, statusnotifier, volume, networkmonitor, worldclock
width=100
width-percent=true
background-color=#f1f3f4

[startmenu]
type=customcommand
alignment=Left
command=true
runWithBash=false
repeat=false
icon=/usr/share/utn-os/icons/utn-logo.png
text=
tooltip=Menú de aplicaciones de chromeos
click=/usr/local/bin/utn-startmenu chromeos
minWidth=28
maxWidth=80
autoRotate=false
[quicklaunch]
type=quicklaunch
alignment=Left

apps\size=3
apps\1\desktop=/usr/share/utn-os/applications/utn-chromeos-files.desktop
apps\2\desktop=/usr/share/utn-os/applications/utn-chromeos-browser.desktop
apps\3\desktop=/usr/share/utn-os/applications/utn-chromeos-terminal.desktop

[taskbar]
type=taskbar
groupingEnabled=true
closeOnMiddleClick=true

[statusnotifier]
type=statusnotifier
alignment=Right

[volume]
type=volume
alignment=Right
device=0

[networkmonitor]
type=networkmonitor
alignment=Right

[worldclock]
type=worldclock
alignment=Right
formatType=short
showDate=true
useAdvancedManualFormat=false
