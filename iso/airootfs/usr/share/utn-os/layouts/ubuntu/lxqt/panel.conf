[General]
config_version=1
panels=panel0, panel1

[panel0]
name=dock
position=Left
panelSize=64
iconSize=32
alignment=0
plugins=startmenu, quicklaunch, taskbar
width=100
width-percent=true
background-color=#1e1e1e

[panel1]
name=topbar
position=Top
panelSize=30
iconSize=18
alignment=1
plugins=statusnotifier_panel1, volume_panel1, networkmonitor_panel1, worldclock_panel1
width=100
width-percent=true
background-color=#1e1e1e

[startmenu]
type=customcommand
alignment=Top
command=true
runWithBash=false
repeat=false
icon=/usr/share/utn-os/icons/utn-logo.png
text=
tooltip=Menú de aplicaciones de ubuntu
click=/usr/local/bin/utn-startmenu ubuntu
minWidth=28
maxWidth=80
autoRotate=false
[quicklaunch]
type=quicklaunch
alignment=Left

apps\size=4
apps\1\desktop=/usr/share/utn-os/applications/utn-ubuntu-browser.desktop
apps\2\desktop=/usr/share/utn-os/applications/utn-ubuntu-files.desktop
apps\3\desktop=/usr/share/utn-os/applications/utn-ubuntu-terminal.desktop
apps\4\desktop=/usr/share/utn-os/applications/utn-ubuntu-office.desktop

[taskbar]
type=taskbar
groupingEnabled=true
closeOnMiddleClick=true

[statusnotifier_panel1]
type=statusnotifier
alignment=Right

[volume_panel1]
type=volume
alignment=Right
device=0

[networkmonitor_panel1]
type=networkmonitor
alignment=Right

[worldclock_panel1]
type=worldclock
alignment=Right
formatType=short
showDate=true
useAdvancedManualFormat=false
