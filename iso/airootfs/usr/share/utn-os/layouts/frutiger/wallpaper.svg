    <circle cx="1800" cy="700" r="130" fill="url(#sphere)"/>
    <circle cx="1750" cy="520" r="20" fill="url(#bubble)"/>
    <circle cx="1700" cy="820" r="28" fill="url(#bubble)"/>
    <circle cx="1820" cy="760" r="16" fill="url(#bubble)"/>
  </g>

  <path d="M0,920 Q480,860 960,930 T1920,915 V1080 H0 Z" fill="#ffffff" opacity="0.5"/>
  <path d="M0,1000 Q640,950 1280,1010 T1920,995 V1080 H0 Z" fill="#b9ecf0" opacity="0.55"/>

  <g>
    <circle cx="200" cy="960" r="14" fill="url(#bubble)"/>
    <circle cx="340" cy="1000" r="22" fill="url(#bubble)"/>
    <circle cx="500" cy="950" r="10" fill="url(#bubble)"/>
    <circle cx="820" cy="1000" r="18" fill="url(#bubble)"/>
    <circle cx="1150" cy="960" r="12" fill="url(#bubble)"/>
    <circle cx="1400" cy="1005" r="20" fill="url(#bubble)"/>
    <circle cx="1620" cy="950" r="9" fill="url(#bubble)"/>
