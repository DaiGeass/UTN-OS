[General]
config_version=1
panels=panel0

[panel0]
name=topbar
position=Top
panelSize=30
iconSize=18
alignment=-1
plugins=startmenu, quicklaunch, taskbar, statusnotifier, volume, networkmonitor, worldclock, showdesktop
width=100
width-percent=true
background-color=#3a8fbf

[startmenu]
type=customcommand
alignment=Left
command=true
runWithBash=false
repeat=false
icon=/usr/share/utn-os/icons/utn-logo.png
text=
tooltip=Menú de aplicaciones de frutiger
click=/usr/local/bin/utn-startmenu frutiger
minWidth=28
maxWidth=80
autoRotate=false
[quicklaunch]
type=quicklaunch
alignment=Left

apps\size=3
apps\1\desktop=/usr/share/utn-os/applications/utn-frutiger-files.desktop
apps\2\desktop=/usr/share/utn-os/applications/utn-frutiger-terminal.desktop
apps\3\desktop=/usr/share/utn-os/applications/utn-frutiger-browser.desktop

[taskbar]
type=taskbar
groupingEnabled=false
closeOnMiddleClick=true

[statusnotifier]
type=statusnotifier
alignment=Right

[volume]
type=volume
alignment=Right
device=0

[networkmonitor]
type=networkmonitor
alignment=Right

[worldclock]
type=worldclock
alignment=Right
formatType=short
showDate=true
useAdvancedManualFormat=false

[showdesktop]
type=showdesktop
alignment=Right
