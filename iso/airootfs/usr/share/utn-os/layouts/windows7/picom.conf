backend = "glx";
experimental-backends = true;
vsync = true;

shadow = true;
shadow-radius = 14;
shadow-opacity = 0.34;
shadow-offset-x = -10;
shadow-offset-y = -10;

fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 8;

corner-radius = 6;
round-borders-on-cli = true;

inactive-opacity = 1.0;
active-opacity = 1.0;

blur-background = true;
blur-background-frame = true;
blur-method = "dual_kawase";
blur-strength = 6;

wintypes = {
    tooltip = { opacity = 0.95; focus = true; blur-background = true; };
    popup_menu = { opacity = 0.97; blur-background = true; };
    dropdown_menu = { opacity = 0.97; blur-background = true; };
    dock = { shadow = false; };
}
