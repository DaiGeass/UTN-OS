[General]
config_version=1
panels=panel0, panel1

[panel0]
name=topbar
position=Top
panelSize=28
iconSize=18
alignment=-1
plugins=startmenu, taskbar, statusnotifier, volume, networkmonitor, worldclock, showdesktop
width=100
width-percent=true
background-color=#1e1e2e

[panel1]
name=dock
position=Bottom
panelSize=56
iconSize=34
alignment=0
plugins=quicklaunch_panel1, showdesktop_panel1
width=72
width-percent=true
background-color=#1e1e2e

[startmenu]
type=customcommand
alignment=Left
command=true
runWithBash=false
repeat=false
icon=/usr/share/utn-os/icons/utn-logo.png
text=
tooltip=Menú de aplicaciones de modern
click=/usr/local/bin/utn-startmenu modern
minWidth=28
maxWidth=80
autoRotate=false
[taskbar]
type=taskbar
groupingEnabled=true
closeOnMiddleClick=true

[statusnotifier]
type=statusnotifier
alignment=Right

[volume]
type=volume
alignment=Right
device=0

[networkmonitor]
type=networkmonitor
alignment=Right

[worldclock]
type=worldclock
alignment=Right
formatType=short
showDate=true
useAdvancedManualFormat=false

[showdesktop]
type=showdesktop
alignment=Right

[quicklaunch_panel1]
type=quicklaunch
alignment=Left

apps\size=4
apps\1\desktop=/usr/share/utn-os/applications/utn-modern-files.desktop
apps\2\desktop=/usr/share/utn-os/applications/utn-modern-terminal.desktop
apps\3\desktop=/usr/share/utn-os/applications/utn-modern-browser.desktop
apps\4\desktop=/usr/share/utn-os/applications/utn-modern-office.desktop

[showdesktop_panel1]
type=showdesktop
alignment=Right
