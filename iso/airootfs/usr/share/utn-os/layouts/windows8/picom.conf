backend = "glx";
experimental-backends = true;
vsync = true;

shadow = true;
shadow-radius = 10;
shadow-opacity = 0.22;
shadow-offset-x = -8;
shadow-offset-y = -8;

fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 8;

inactive-opacity = 1.0;
active-opacity = 1.0;

wintypes = {
    tooltip = { opacity = 0.95; focus = true; };
    popup_menu = { opacity = 0.97; };
    dropdown_menu = { opacity = 0.97; };
    dock = { shadow = false; };
}