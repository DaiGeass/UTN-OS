[General]
config_version=1
panels=panel0

[panel0]
name=taskbar
position=Bottom
panelSize=44
iconSize=22
alignment=-1
plugins=startmenu, quicklaunch, taskbar, statusnotifier, volume, networkmonitor, worldclock, showdesktop
width=100
width-percent=true
background-color=#1f1f1f

[startmenu]
type=customcommand
alignment=Left
command=true
runWithBash=false
repeat=false
icon=/usr/share/utn-os/icons/utn-logo.png
text=
tooltip=Menú de aplicaciones de windows8
click=/usr/local/bin/utn-startmenu windows8
minWidth=28
maxWidth=80
autoRotate=false
[quicklaunch]
type=quicklaunch
alignment=Left

apps\size=3
apps\1\desktop=/usr/share/utn-os/applications/utn-windows8-files.desktop
apps\2\desktop=/usr/share/utn-os/applications/utn-windows8-browser.desktop
apps\3\desktop=/usr/share/utn-os/applications/utn-windows8-terminal.desktop

[taskbar]
type=taskbar
groupingEnabled=true
showOnlyCurrentScreenTasks=false
closeOnMiddleClick=true

[statusnotifier]
type=statusnotifier
alignment=Right

[volume]
type=volume
alignment=Right
device=0

[networkmonitor]
type=networkmonitor
alignment=Right

[worldclock]
type=worldclock
alignment=Right
formatType=short
showDate=true
useAdvancedManualFormat=false

[showdesktop]
type=showdesktop
alignment=Right
